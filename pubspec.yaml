name: ai_routine_assistant
description: "A privacy-first, on-device AI routine assistant and screen-time manager."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.8.3
  flutter_background_service: ^5.0.0
  flutter_local_notifications: ^17.0.0
  fl_chart: ^0.68.0
  flutter_riverpod: ^2.5.1
  permission_handler: ^11.3.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
